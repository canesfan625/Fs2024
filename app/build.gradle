plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khayman.msfs2024efb'
    compileSdk 34

    defaultConfig {
        applicationId "com.khayman.msfs2024efb"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2611.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
